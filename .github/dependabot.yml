version: 2
updates:
  - package-ecosystem: github-actions
    directory: /
    schedule:
      interval: weekly
    groups:
      codeql-actions:
        patterns:
          - "github/codeql-action/*"
  - package-ecosystem: swift
    directory: /
    schedule:
      interval: weekly
  - package-ecosystem: npm
    directory: /docs/assets/source
    schedule:
      interval: weekly

name: OpenSSF Scorecard

on:
  push:
    branches:
      - main
  schedule:
    - cron: "24 5 * * 1"
  workflow_dispatch:

permissions: {}

jobs:
  scorecard:
    name: Supply-chain security scan
    runs-on: ubuntu-latest
    timeout-minutes: 15
    permissions:
      actions: read
      checks: read
      contents: read
      id-token: write
      issues: read
      pull-requests: read
      security-events: write

    steps:
      - name: Checkout
        # actions/checkout@v7
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          persist-credentials: false

      - name: Run OpenSSF Scorecard
        # ossf/scorecard-action@v2.4.4
        uses: ossf/scorecard-action@fa7117db83c52d787ae5a89f350999701505d78e
        continue-on-error: true
        with:
          results_file: scorecard-results.sarif
          results_format: sarif
          publish_results: true

      - name: Upload Scorecard SARIF
        if: ${{ always() && hashFiles('scorecard-results.sarif') != '' }}
        # github/codeql-action/upload-sarif@v4
        uses: github/codeql-action/upload-sarif@cdf488f595d80d6e07e03d4674febd5ab45fa938
        with:
          sarif_file: scorecard-results.sarif
